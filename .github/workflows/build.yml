name: Empaquetado (APK + Windows)

# Compila los binarios nativos a partir del mismo bundle web:
#  - Android APK (Capacitor) en un runner Linux con el Android SDK.
#  - Ejecutable + instaladores de Windows (Tauri) en un runner Windows.
# Se puede lanzar a mano (workflow_dispatch), en cada push a la rama de trabajo
# o al publicar un tag de versión (v*).

on:
  workflow_dispatch:
  push:
    branches: [claude/exersuite3d-gym-platform-70qkf7]
    tags: ["v*"]

jobs:
  android-apk:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Construir bundle web y sincronizar Capacitor
        run: npm run android:sync

      - name: Compilar APK de depuración
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: exersuite3d-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows-exe:
    name: Windows standalone (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilación de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar app de escritorio (.exe + instaladores)
        run: npm run tauri:build

      - name: Subir ejecutable e instaladores
        uses: actions/upload-artifact@v4
        with:
          name: exersuite3d-windows
          path: |
            src-tauri/target/release/exersuite3d.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
