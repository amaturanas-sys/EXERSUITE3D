name: Empaquetado (APK + Windows)

# Compila los binarios nativos a partir del mismo bundle web:
#  - Android APK (Capacitor) en un runner Linux con el Android SDK.
#  - Ejecutable + instaladores de Windows (Tauri) en un runner Windows.
# Se puede lanzar a mano (workflow_dispatch), en cada push a la rama de trabajo
# o al publicar un tag de versión (v*).

on:
  workflow_dispatch:
  push:
    branches: [claude/exersuite3d-gym-platform-70qkf7]
    tags: ["v*"]

jobs:
  android-apk:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Solo lo necesario para compilar el APK: el paquete "tools" por
          # defecto arrastra el EMULADOR (~700 MB), que no usamos y cuya
          # descarga corrupta tumbó el run 69. Gradle instala build-tools y
          # platforms por sí mismo (las licencias ya quedan aceptadas).
          packages: "platform-tools"

      - name: Instalar dependencias
        run: npm ci

      - name: Construir bundle web y sincronizar Capacitor
        run: npm run android:sync

      - name: Compilar APK de depuración
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # El APK viaja con el nombre EXERSUITE3D.APK (lo espera el alojamiento
      # en HuggingFace: sin renombrados manuales).
      - name: Renombrar APK a EXERSUITE3D.APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          mv "$APK" android/app/build/outputs/apk/debug/EXERSUITE3D.APK

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: exersuite3d-android-debug
          path: android/app/build/outputs/apk/debug/EXERSUITE3D.APK
          if-no-files-found: error

  windows-exe:
    name: Windows standalone (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilación de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      # El empaquetador de Tauri se descarga WiX y NSIS de github.com la
      # primera vez. Guardarlos evita repetir esa descarga en cada run.
      - name: Cache de las herramientas del empaquetador (WiX + NSIS)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-wix314

      - name: Compilar app de escritorio (.exe + instaladores)
        shell: pwsh
        run: |
          # Esa descarga se cae a veces en el runner ("io: Peer disconnected")
          # y tumbaba la release entera aunque el .exe ya estuviera compilado
          # (así se perdió el empaquetado del tag v0.2.52). Reintentamos: el
          # empaquetador comprueba qué archivos le faltan y solo baja esos, y
          # la compilación de Rust ya está en caché, así que un reintento
          # cuesta poco.
          for ($i = 1; $i -le 3; $i++) {
            npm run tauri:build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::Empaquetado fallido (intento $i de 3); reintentando en 20 s"
            Start-Sleep -Seconds 20
          }
          Write-Host "::error::El empaquetado de Windows falló en los 3 intentos"
          exit 1

      - name: Subir ejecutable e instaladores
        uses: actions/upload-artifact@v4
        with:
          name: exersuite3d-windows
          path: |
            src-tauri/target/release/EXERSUITE3D.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publicar Release
    # Solo al publicar un tag de versión (v*); en pushes normales se omite.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-apk, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Preparar notas de la Release desde CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## EXERSUITE3D ${GITHUB_REF_NAME}"
            echo
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { cap=1; next }
              cap && /^## \[/ { exit }
              cap && /^\[[^]]+\]:[[:space:]]/ { exit }
              cap { print }
            ' CHANGELOG.md
            echo
            echo "**Changelog completo:** https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          } > RELEASE_NOTES.md
          echo "----- notas generadas -----"
          cat RELEASE_NOTES.md

      - name: Crear/actualizar la GitHub Release y adjuntar binarios
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
