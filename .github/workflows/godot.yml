# Valida el kit de Godot con el MOTOR REAL y compila los binarios nativos
# (APK Android + EXE Windows) sin necesidad de un PC local: el contenedor de
# desarrollo no puede ejecutar Godot (política de red), pero la CI sí.
name: godot-nativo

on:
  push:
    branches: ["**"]
    paths:
      - "godot/**"
      - ".github/workflows/godot.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de una release ya publicada a la que adjuntar los binarios (opcional)"
        required: false
        default: ""

env:
  # 4.4+: Jolt Physics integrado e interpolación física 3D (anti-stuttering).
  GODOT_VERSION: "4.4.1-stable"
  GODOT_DIR_VERSION: "4.4.1.stable"

jobs:
  validar:
    name: Validar con el motor (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Godot headless
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot-bin
          chmod +x godot-bin

      - name: Importar el proyecto (registra clases y recursos)
        run: ./godot-bin --headless --path godot --import || true

      - name: Chequeo de sintaxis de todos los .gd
        run: |
          set -e
          for f in $(find godot -name '*.gd' | sed 's|^godot/||'); do
            echo "check $f"
            ./godot-bin --headless --path godot --check-only -s "res://$f"
          done

      - name: Prueba de humo (carga el ejemplo + 2 s de física real)
        run: ./godot-bin --headless --path godot -s res://tests/smoke.gd

  capturas:
    name: Capturas de la interfaz (revisión visual)
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Godot
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot-bin
          chmod +x godot-bin

      - name: Importar el proyecto
        run: ./godot-bin --headless --path godot --import || true

      - name: Ejecutar la app y capturar pantallas (renderer por software)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a -s "-screen 0 1280x800x24" ./godot-bin --path godot \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --resolution 1280x800 -s res://tests/screenshots.gd
          mkdir -p capturas
          cp "$HOME/.local/share/godot/app_userdata/EXERSUITE3D/capturas/"*.png capturas/
          ls -la capturas/

      - name: Subir capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-ui
          path: capturas/

  exportar:
    name: Exportar APK Android + EXE Windows
    needs: validar
    runs-on: ubuntu-latest
    # Adjuntar binarios a la release requiere escritura (igual que build.yml;
    # sin esto el paso final falla con "Resource not accessible").
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Godot + plantillas de exportación
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot-bin
          chmod +x godot-bin
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_DIR_VERSION}"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_DIR_VERSION}/"

      - name: Configurar Android (keystore de debug + rutas SDK/JDK)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          JDK="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          echo "SDK=$SDK"; ls "$SDK/build-tools" | tail -2
          echo "JDK=$JDK"; "$JDK/bin/java" -version
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey -keypass android -storepass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.4.tres" "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Importar el proyecto
        run: ./godot-bin --headless --path godot --import || true

      - name: Exportar EXE Windows (release)
        run: |
          ./godot-bin --headless --path godot --export-release "Windows Desktop" ../EXERSUITE3D-godot.exe
          ls -la EXERSUITE3D-godot.exe

      - name: Exportar APK Android (debug)
        run: |
          ./godot-bin --headless --verbose --path godot --export-debug "Android" ../EXERSUITE3D-godot.apk 2>&1 | grep -vE "^(reimport|import|Loading|Loaded|Using|Regist|Creat|Optimiz|Index)" | tail -80
          ls -la EXERSUITE3D-godot.apk

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exersuite3d-godot-nativo
          if-no-files-found: warn
          path: |
            EXERSUITE3D-godot.apk
            EXERSUITE3D-godot.exe

      - name: Adjuntar a la Release (al publicarla o por tag manual)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.ref_name || inputs.release_tag }}
          files: |
            EXERSUITE3D-godot.apk
            EXERSUITE3D-godot.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
